name: Task-manager

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_image_frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend image
        run: |
          cd frontend
          docker build -t sanketjadhav84/frontend-img:${{ github.sha }} .
          docker push sanketjadhav84/frontend-img:${{ github.sha }}

  build_image_backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: |
          cd backend
          docker build -t sanketjadhav84/backend-img:${{ github.sha }} .
          docker push sanketjadhav84/backend-img:${{ github.sha }}

  docker-compose:
    runs-on: ubuntu-latest
    needs: [build_image_frontend, build_image_backend]
    steps:
      - uses: actions/checkout@v4

      - name: Start containers
        run: |
          docker compose down
          docker compose up -d --build
