name: Task-manager

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_image_frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend image
        run: |
          cd frontend
          docker build -t sanketjadhav84/frontend-img:${{ github.sha }} .
          docker push sanketjadhav84/frontend-img:${{ github.sha }}

  build_image_backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: |
          cd backend
          docker build -t sanketjadhav84/backend-img:${{ github.sha }} .
          docker push sanketjadhav84/backend-img:${{ github.sha }}

  deploy_to_ec2:
    runs-on: ubuntu-latest
    needs: [build_image_frontend, build_image_backend]

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd /home/ubuntu/task-manager

            export IMAGE_TAG=${{ github.sha }}

            kubectl apply -f k8s/backend-deployment.yaml
            kubectl apply -f k8s/backend-services.yaml
            kubectl apply -f k8s/frontend-deployment.yaml
            kubectl apply -f k8s/frontend-services.yaml

            kubectl set image deployment/backend-deployment \
              backend-container=sanketjadhav84/backend-img:${{ github.sha }}

            kubectl set image deployment/frontend-deployment \
              frontend-container=sanketjadhav84/frontend-img:${{ github.sha }}
 
            kubectl rollout restart deployment frontend-deployment
            kubectl rollout restart deployment backend-deployment
