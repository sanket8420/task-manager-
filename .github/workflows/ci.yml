name: Task-manager

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  build_image_frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        run: |
          cd frontend
          docker build -t sanketjadhav84/frontend-img:latest .
          docker push sanketjadhav84/frontend-img:latest


  build_image_backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          cd backend
          docker build -t sanketjadhav84/backend-img:latest .      
          docker push sanketjadhav84/backend-img:latest 
          
        
    
