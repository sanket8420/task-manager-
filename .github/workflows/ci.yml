name: Task-manager

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # =========================
  # Build Frontend
  # =========================
  build_image_frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        run: |
          cd frontend

          docker build \
            -t sanketjadhav84/frontend-img:${{ github.sha }} .

          docker push \
            sanketjadhav84/frontend-img:${{ github.sha }}


  # =========================
  # Build Backend
  # =========================
  build_image_backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        run: |
          cd backend

          docker build \
            -t sanketjadhav84/backend-img:${{ github.sha }} .

          docker push \
            sanketjadhav84/backend-img:${{ github.sha }}


  # =========================
  # Deploy to EC2
  # =========================
  deploy_to_ec2:
    runs-on: ubuntu-latest

    needs:
      - build_image_frontend
      - build_image_backend

    steps:

      - name: Prepare SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/ec2_key
          chmod 600 /tmp/ec2_key

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key_path: /tmp/ec2_key
          port: 22
          debug: true

          script: |
            set -e

            echo "Connected to EC2"
            whoami
            hostname

            cd /home/ubuntu/task-manager

            export IMAGE_TAG=${{ github.sha }}

            echo "Deploying image tag: $IMAGE_TAG"

            # Apply Kubernetes manifests
            kubectl apply -f k8s/backend-deployment.yaml
            kubectl apply -f k8s/backend-services.yaml

            kubectl apply -f k8s/frontend-deployment.yaml
            kubectl apply -f k8s/frontend-services.yaml

            # Update backend image
            kubectl set image deployment/backend-deployment \
              backend-container=sanketjadhav84/backend-img:$IMAGE_TAG

            # Update frontend image
            kubectl set image deployment/frontend-deployment \
              frontend-container=sanketjadhav84/frontend-img:$IMAGE_TAG

            # Restart deployments
            kubectl rollout restart deployment/backend-deployment
            kubectl rollout restart deployment/frontend-deployment

            # Wait for rollout
            kubectl rollout status deployment/backend-deployment
            kubectl rollout status deployment/frontend-deployment

            echo "Deployment completed successfully"
