apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: backend-container
          image: registry.gitlab.com/fineshift/users/sanket-jadhav/task-manager-project/backend
          imagePullPolicy: Always
          ports:
            - containerPort: 8000

