          image: registry.gitlab.com/fineshift/users/sanket-jadhav/task-manager-project/backendapiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret

      containers:
        - name: backend-container
          image: registry.gitlab.com/fineshift/users/sanket-jadhav/task-manager-project/backend
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DATABASE_URL

            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SECRET_KEY
          imagePullPolicy: Always
          ports:
            - containerPort: 8000

