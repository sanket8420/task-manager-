services:
    db:
        image: postgres:15
        environment:
            POSTGRES_USER: taskuser
            POSTGRES_PASSWORD: taskpass
            POSTGRES_DB: taskdb
        volumes:
            - db_data:/var/lib/postgresql/data
        networks:
            - task-manager
    
    frontend:
        image: task-manager-frontend
        networks:
            - task-manager
    
    backend:
        image: task-manager-backend
        networks: 
            - task-manager

networks: 
  task-manager:
    driver: bridge

volumes:
    db_data: 

